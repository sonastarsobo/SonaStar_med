<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login · Anatomy Learning</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body class="auth">
    <div class="glow" aria-hidden="true"></div>
    <div class="card">
      <div class="auth-head">
        <span class="eyebrow"><span class="logo">A</span> Anatomy Learning</span>
        <h1>Welcome <em>back</em></h1>
        <p class="sub">Sign in to continue exploring the human body in 3D.</p>
      </div>
      <form id="f" novalidate>
        <label for="email">Email</label
        ><input id="email" type="email" autocomplete="email" placeholder="you@example.com" />
        <label for="pw">Password</label
        ><input id="pw" type="password" autocomplete="current-password" placeholder="••••••••" />
        <div class="row">
          <button class="btn" id="go">Sign in &rarr;</button>
        </div>
        <div class="msg" id="msg" role="alert"></div>
      </form>
      <div class="foot">New here? <a href="register.html">Create an account</a></div>
    </div>
    <script type="module">
      import { login, getCurrentProfile, homeFor } from "./js/auth.js";
      const $ = (id) => document.getElementById(id),
        msg = $("msg");
      $("f").addEventListener("submit", async (e) => {
        e.preventDefault();
        msg.className = "msg";
        const email = $("email").value.trim(),
          pw = $("pw").value;
        if (!/^\S+@\S+\.\S+$/.test(email))
          return (
            (msg.textContent = "Enter a valid email."),
            (msg.className = "msg error")
          );
        if (!pw)
          return (
            (msg.textContent = "Enter your password."),
            (msg.className = "msg error")
          );
        $("go").disabled = true;
        msg.textContent = "Signing in...";
        try {
          await login(email, pw);
          const p = await getCurrentProfile();
          if (!p)
            throw new Error(
              "Profile not found. Check that schema.sql was run.",
            );
          location.href = homeFor(p.role);
        } catch (err) {
          console.error(err);
          msg.textContent = err.message;
          msg.className = "msg error";
          $("go").disabled = false;
        }
      });
    </script>
  </body>
</html>
